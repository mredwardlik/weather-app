name: build

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test WeatherApp.Tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21
      - run: dotnet workload install maui-android
      - name: Install the Android platform the app targets
        run: >
          dotnet build WeatherApp -t:InstallAndroidDependencies -p:AppTargetFramework=net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - run: dotnet build WeatherApp -c Release -p:AppTargetFramework=net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - run: dotnet build WeatherApp -c Release -p:AppTargetFramework=net10.0-windows10.0.19041.0
